name: Verify a release

# A tag is what applications install: check that it installs as it is, from GitHub, and builds; then give it its
# GitHub Release, its notes taken from CHANGELOG.md.
on:
  push:
    tags: ['v*']

# Read-only, but where a job says otherwise (the Release).
permissions:
  contents: read

jobs:
  install-the-tag:
    name: The template installs the tag from GitHub and builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: The release commit carries dist/, and nothing for npm to build
        run: |
          test -f dist/index.js
          test -f dist/styles/styles.css
          node -e "const m = require('./package.json'); if (m.scripts) { console.error('A release commit has no scripts: npm would build it on install.'); process.exit(1) }"
      - name: The template, on this tag from GitHub
        # The tag's name reaches the shell as a variable, never written into the script.
        env:
          DEPENDENCY: github:${{ github.repository }}#${{ github.ref_name }}
        run: |
          cp -r templates/app "$RUNNER_TEMP/app"
          cd "$RUNNER_TEMP/app"
          node -e "const f = 'package.json', p = require('./' + f); p.dependencies['ioiti-ui'] = process.env.DEPENDENCY; require('fs').writeFileSync(f, JSON.stringify(p, null, 2))"
          npm install --no-audit --no-fund
          npm run build
          test -f dist/ioiti-theme.js

  # The Release says what the CHANGELOG says of the version (scripts/release-notes.mjs), once the tag is known to
  # install; a pre-release (1.0.0-rc.1) is marked so. Pushed again, the tag's Release takes the notes again.
  github-release:
    name: The tag's GitHub Release, its notes from CHANGELOG.md
    needs: install-the-tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: The notes
        run: node scripts/release-notes.mjs "$TAG" > "$RUNNER_TEMP/notes.md"
        env:
          TAG: ${{ github.ref_name }}
      - name: The Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release edit "$TAG" --notes-file "$RUNNER_TEMP/notes.md"
          else
            prerelease=()
            case "$TAG" in *-*) prerelease=(--prerelease) ;; esac
            gh release create "$TAG" --verify-tag --title "ioiti-ui $TAG" --notes-file "$RUNNER_TEMP/notes.md" "${prerelease[@]}"
          fi
