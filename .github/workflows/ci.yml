name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # By hand (Actions > CI > Run workflow): the checks again and, on main, the gallery published again.
  workflow_dispatch:

# Read-only, but where a job says otherwise (the gallery's publication).
permissions:
  contents: read

# A pull request's run is cancelled by the next push to it; main's runs each go to the end (the run's own id).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

# The actions are pinned to a commit (the version beside it); .github/dependabot.yml proposes the next ones.
jobs:
  checks:
    name: Lint, types, tests, builds, and the package as an application gets it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build:gallery
      - run: npm run check:package

  # The oldest Node an application may build with (package.json's engines): the package builds, and the template
  # installs it, builds and weighs it there, as an application would. The tests are the package's own and need the
  # Node of .nvmrc (their jsdom asks for 22.22.2, 24.15 or later): the checks job runs them.
  node-22:
    name: An application on Node 22.12, the oldest engines allows
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.12.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:package

  # The gallery in real browsers (e2e/): every page loads and logs nothing wrong, axe with the stylesheets in light and
  # dark, the keyboard's journeys, motion and reduced motion; in Firefox and WebKit, the pages and journeys @smoke.
  browser:
    name: The gallery in Chromium, Firefox and WebKit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run e2e
      - run: npm run e2e:smoke
      - name: The report, to see what failed
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 14

  # The screenshots (e2e/visual.spec.ts), in Playwright's Linux image, as the baselines were made: a picture that moved
  # fails, its diff uploaded. A picture without a baseline yet is written and uploaded (visual-baselines), to commit
  # into e2e/__screenshots__ once looked at.
  visual:
    name: The gallery's screenshots, on Linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run e2e:visual
      - name: The pictures written, without a baseline yet
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-baselines
          path: e2e/__screenshots__
          if-no-files-found: ignore
          retention-days: 14
      - name: The pictures that moved, and their diffs
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-diffs
          path: test-results
          retention-days: 14

  # What an application installs with ioiti-ui (its dependencies, not the tools that build it), against npm's advisories.
  # Apart from the checks: an advisory published tomorrow says so here without holding the gallery back.
  audit:
    name: What an application installs, against npm's advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      - run: npm audit --omit=dev --audit-level=high

  # main's gallery on GitHub Pages (https://ioiti.github.io/ioiti-ui/), once every check has passed.
  # Pages publishes what this workflow gives it: Settings > Pages > Source is GitHub Actions.
  gallery:
    name: The gallery, built under the site's path
    needs: [checks, node-22, browser, visual]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: The site's address
        id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - run: npm ci
      - run: npm run build
      - name: The gallery on dist/, under the site's path (/ioiti-ui/)
        run: npm run build:gallery -- --base "$BASE_PATH/"
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
      - name: Any page's address opens the gallery (Pages answers 404.html where it has no file)
        run: cp gallery/dist/index.html gallery/dist/404.html
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: gallery/dist

  publish:
    name: The gallery, on GitHub Pages
    needs: gallery
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One publication at a time, none stopped half-way: the latest one waiting goes next.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
